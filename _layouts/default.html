<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | Anand Ram Sathyanarayanan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Senior Engineering Consultant specializing in MBSE, Automotive Controls, and Digital Transformation">
  <meta name="author" content="Anand Ram Sathyanarayanan">
  {% if page.noindex %}
  <meta name="robots" content="noindex, nofollow">
  {% endif %}

  <!-- Mulish Font (Toha Theme) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/custom.css">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/favicon.svg">
</head>

<body>
  <!-- Navigation -->
  <nav class="custom-navbar">
    <div class="nav-left">
      <a href="/index.html" class="nav-brand">
        <svg class="nav-logo-svg" width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:var(--primary-color)"/>
              <stop offset="100%" style="stop-color:var(--accent-color)"/>
            </linearGradient>
          </defs>
          <!-- Hexagonal background -->
          <path d="M21 2L38.3205 11.5V30.5L21 40L3.67949 30.5V11.5L21 2Z" fill="url(#logoGradient)"/>
          <!-- Stylized A with engineering precision -->
          <path d="M14 31L21 9L28 31M16.5 25H25.5" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <!-- R accent - dot above representing innovation/focus -->
          <path d="M21 9V5" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <circle cx="21" cy="4" r="1.8" fill="white"/>
        </svg>
      </a>
    </div>
    <div class="nav-right">
      <div class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/#about">About</a>
        {% if site.show_projects %}
        <a href="/projects.html">Projects</a>
        {% endif %}
        <a href="/blog.html">Blog</a>
        <button class="mode-toggle" onclick="toggleMode()" aria-label="Toggle dark mode">
          <span class="mode-icon"></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  {% if page.title == "Home" %}
  <main>
    {{ content }}
  </main>
  {% else %}
  <main>
    {{ content }}
  </main>
  {% endif %}

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <p>&copy; {{ site.time | date: "%Y" }} Anand Ram Sathyanarayanan. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    // Dark mode toggle
    const toggleBtn = document.querySelector('.mode-toggle');
    const modeIcon = document.querySelector('.mode-icon');
    const currentMode = localStorage.getItem("mode");

    function updateModeIcon(isDark) {
      modeIcon.innerHTML = isDark
        ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    }

    if (currentMode === "dark") {
      document.body.classList.add("dark-mode");
      updateModeIcon(true);
    } else {
      updateModeIcon(false);
    }

    function toggleMode() {
      const isDark = document.body.classList.toggle("dark-mode");
      updateModeIcon(isDark);
      localStorage.setItem("mode", isDark ? "dark" : "light");
    }
  </script>

  <!-- Active link highlight -->
  <script>
    const path = window.location.pathname;
    document.querySelectorAll('.nav-links a').forEach(link => {
      const href = link.getAttribute('href');
      if (href === path || (href === '/index.html' && path === '/') ||
          (href.includes('#') && path === '/index.html')) {
        link.classList.add('active-tab');
      }
    });
  </script>

</body>
</html>
