<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bmsBg)"/>

  <!-- Battery pack outline -->
  <rect x="60" y="40" width="280" height="100" rx="10" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="2"/>

  <!-- Battery cells -->
  <rect x="80" y="55" width="40" height="70" rx="4" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="1"/>
  <rect x="130" y="55" width="40" height="70" rx="4" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="1"/>
  <rect x="180" y="55" width="40" height="70" rx="4" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="1"/>
  <rect x="230" y="55" width="40" height="70" rx="4" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="1"/>
  <rect x="280" y="55" width="40" height="70" rx="4" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="1"/>

  <!-- Cell charge indicators -->
  <rect x="85" y="75" width="30" height="45" rx="2" fill="#22c55e"/>
  <rect x="135" y="65" width="30" height="55" rx="2" fill="#22c55e"/>
  <rect x="185" y="80" width="30" height="40" rx="2" fill="#eab308"/>
  <rect x="235" y="60" width="30" height="60" rx="2" fill="#22c55e"/>
  <rect x="285" y="70" width="30" height="50" rx="2" fill="#22c55e"/>

  <!-- BMS chip -->
  <rect x="150" y="150" width="100" height="30" rx="4" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <text x="200" y="170" font-family="Arial" font-size="12" font-weight="700" fill="white" text-anchor="middle">BMS ECU</text>

  <!-- Connection lines -->
  <line x1="100" y1="125" x2="175" y2="150" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <line x1="200" y1="125" x2="200" y2="150" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <line x1="300" y1="125" x2="225" y2="150" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

  <!-- Status indicators -->
  <circle cx="350" cy="50" r="8" fill="#22c55e"/>
  <text x="350" y="70" font-family="Arial" font-size="9" fill="white" text-anchor="middle">SoC</text>
  <circle cx="350" cy="100" r="8" fill="#3b82f6"/>
  <text x="350" y="120" font-family="Arial" font-size="9" fill="white" text-anchor="middle">SoP</text>

  <!-- Title -->
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">ADVANCED BMS CONTROLS</text>
</svg>
