<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2c5282"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bgGrad)"/>
  <!-- Ground -->
  <ellipse cx="200" cy="200" rx="250" ry="50" fill="url(#groundGrad)"/>
  <!-- Mountains -->
  <polygon points="50,150 120,90 190,150" fill="#4a5568"/>
  <polygon points="150,150 250,70 350,150" fill="#2d3748"/>
  <!-- SUV Body -->
  <rect x="120" y="110" width="160" height="50" rx="8" fill="#0d6efd"/>
  <rect x="140" y="90" width="100" height="30" rx="5" fill="#0d6efd"/>
  <!-- Windows -->
  <rect x="145" y="95" width="40" height="20" rx="3" fill="#a0aec0"/>
  <rect x="190" y="95" width="45" height="20" rx="3" fill="#a0aec0"/>
  <!-- Wheels -->
  <circle cx="155" cy="160" r="18" fill="#1a202c"/>
  <circle cx="155" cy="160" r="10" fill="#4a5568"/>
  <circle cx="245" cy="160" r="18" fill="#1a202c"/>
  <circle cx="245" cy="160" r="10" fill="#4a5568"/>
  <!-- Headlights -->
  <rect x="270" y="120" width="10" height="15" rx="2" fill="#ffd700"/>
  <!-- AWD Badge -->
  <rect x="280" y="20" width="100" height="30" rx="15" fill="rgba(255,255,255,0.15)"/>
  <text x="330" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="white" text-anchor="middle">4x4 AWD</text>
  <!-- Title -->
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">FORD BRONCO AWD SYSTEM</text>
</svg>
