<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="mbseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd"/>
      <stop offset="100%" style="stop-color:#0dcaf0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#mbseBg)"/>

  <!-- Network nodes -->
  <circle cx="80" cy="60" r="25" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <circle cx="200" cy="40" r="25" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <circle cx="320" cy="60" r="25" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <circle cx="140" cy="120" r="25" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <circle cx="260" cy="120" r="25" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <circle cx="200" cy="160" r="25" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="3"/>

  <!-- Connection lines -->
  <line x1="80" y1="60" x2="200" y2="40" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="200" y1="40" x2="320" y2="60" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="80" y1="60" x2="140" y2="120" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="320" y1="60" x2="260" y2="120" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="140" y1="120" x2="200" y2="160" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="260" y1="120" x2="200" y2="160" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="200" y1="40" x2="200" y2="160" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Icons in nodes -->
  <text x="80" y="65" font-family="Arial" font-size="14" fill="white" text-anchor="middle">REQ</text>
  <text x="200" y="45" font-family="Arial" font-size="14" fill="white" text-anchor="middle">SYS</text>
  <text x="320" y="65" font-family="Arial" font-size="14" fill="white" text-anchor="middle">SIM</text>
  <text x="140" y="125" font-family="Arial" font-size="14" fill="white" text-anchor="middle">DEV</text>
  <text x="260" y="125" font-family="Arial" font-size="14" fill="white" text-anchor="middle">TEST</text>
  <text x="200" y="165" font-family="Arial" font-size="14" fill="white" text-anchor="middle">V&V</text>

  <!-- Title -->
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">MBSE DIGITAL THREAD</text>
</svg>
