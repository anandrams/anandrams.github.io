<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="hilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#hilBg)"/>

  <!-- MIL Box -->
  <rect x="40" y="60" width="80" height="50" rx="8" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <text x="80" y="90" font-family="Arial" font-size="16" font-weight="700" fill="white" text-anchor="middle">MIL</text>

  <!-- SIL Box -->
  <rect x="160" y="60" width="80" height="50" rx="8" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <text x="200" y="90" font-family="Arial" font-size="16" font-weight="700" fill="white" text-anchor="middle">SIL</text>

  <!-- HIL Box -->
  <rect x="280" y="60" width="80" height="50" rx="8" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="3"/>
  <text x="320" y="90" font-family="Arial" font-size="16" font-weight="700" fill="white" text-anchor="middle">HIL</text>

  <!-- Arrows -->
  <path d="M 120 85 L 155 85" fill="none" stroke="white" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="155,82 160,85 155,88" fill="white"/>
  <path d="M 240 85 L 275 85" fill="none" stroke="white" stroke-width="2"/>
  <polygon points="275,82 280,85 275,88" fill="white"/>

  <!-- Model reuse indicator -->
  <rect x="120" y="130" width="160" height="35" rx="17" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1"/>
  <text x="200" y="152" font-family="Arial" font-size="14" font-weight="600" fill="white" text-anchor="middle">80% Model Reuse</text>

  <!-- Title -->
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">MIL-HIL INTEGRATION FRAMEWORK</text>
</svg>
