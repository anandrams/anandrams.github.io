<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="nvhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#nvhBg)"/>

  <!-- Sound wave visualization -->
  <path d="M 30 100 Q 50 60 70 100 Q 90 140 110 100 Q 130 60 150 100 Q 170 140 190 100 Q 210 60 230 100 Q 250 140 270 100 Q 290 60 310 100 Q 330 140 350 100 Q 370 60 390 100"
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>

  <path d="M 30 100 Q 50 75 70 100 Q 90 125 110 100 Q 130 75 150 100 Q 170 125 190 100 Q 210 75 230 100 Q 250 125 270 100 Q 290 75 310 100 Q 330 125 350 100 Q 370 75 390 100"
        fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

  <path d="M 30 100 Q 50 85 70 100 Q 90 115 110 100 Q 130 85 150 100 Q 170 115 190 100 Q 210 85 230 100 Q 250 115 270 100 Q 290 85 310 100 Q 330 115 350 100 Q 370 85 390 100"
        fill="none" stroke="white" stroke-width="2"/>

  <!-- Engine icon -->
  <rect x="170" y="130" width="60" height="40" rx="5" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <circle cx="185" cy="150" r="8" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="215" cy="150" r="8" fill="none" stroke="white" stroke-width="2"/>
  <rect x="178" y="125" width="44" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>

  <!-- dB indicator -->
  <rect x="300" y="30" width="80" height="50" rx="8" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1"/>
  <text x="340" y="55" font-family="Arial" font-size="18" font-weight="700" fill="white" text-anchor="middle">-2dB</text>
  <text x="340" y="72" font-family="Arial" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Reduction</text>

  <!-- NVH label -->
  <rect x="20" y="30" width="70" height="30" rx="15" fill="rgba(255,255,255,0.2)"/>
  <text x="55" y="50" font-family="Arial" font-size="14" font-weight="700" fill="white" text-anchor="middle">NVH</text>

  <!-- Title -->
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)" text-anchor="middle">MULTI-ATTRIBUTE OPTIMIZATION</text>
</svg>
